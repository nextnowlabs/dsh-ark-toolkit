name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-package:
    if: github.event.repository.visibility == 'public'
    name: Portable package (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.19.0, 24.x]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile --trust-lockfile --registry=https://registry.npmjs.org

      - name: Install the compatible DSH CLI for Profile acceptance
        run: |
          npm install --global --prefix "$RUNNER_TEMP/dsh-cli" \
            @deepseek-ai/dsh@0.1.0-rc.8 \
            --registry=https://registry.npmjs.org
          echo "$RUNNER_TEMP/dsh-cli/bin" >> "$GITHUB_PATH"

      - name: Build against public registry exports
        run: pnpm run build

      - name: Verify committed build artifacts
        run: git diff --exit-code -- lib

      - name: Run unit and required Profile acceptance tests
        run: pnpm test
        env:
          DSH_VISION_REQUIRE_PROFILE_E2E: "1"

      - name: Verify portable package surface
        run: npm run verify:portable

  portable-package-windows:
    if: github.event.repository.visibility == 'public'
    name: Portable package (Windows, Node 24)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile --trust-lockfile --registry=https://registry.npmjs.org

      - name: Install the compatible DSH CLI for Profile acceptance
        shell: bash
        run: |
          npm install --global --prefix "$RUNNER_TEMP/dsh-cli" \
            @deepseek-ai/dsh@0.1.0-rc.8 \
            --registry=https://registry.npmjs.org
          echo "$RUNNER_TEMP/dsh-cli" >> "$GITHUB_PATH"

      - name: Build against public registry exports
        run: pnpm run build

      - name: Verify committed build artifacts
        run: git diff --exit-code -- lib

      - name: Run unit and required Profile acceptance tests
        run: pnpm test
        env:
          DSH_VISION_REQUIRE_PROFILE_E2E: "1"

      - name: Verify portable package surface
        run: npm run verify:portable
